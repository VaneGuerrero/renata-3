  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:#fff;
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
         padding:calc(env(safe-area-inset-top) + var(--s) * 150) 8px calc(env(safe-area-inset-bottom) + 6px); gap:6px; }
  /* fondo: parte superior (logo + formas) y círculo rayado inferior, recortados de la misma imagen */
  body::before, body::after { content:""; position:fixed; z-index:0; pointer-events:none;
         width:calc(var(--s) * 654); left:50%; transform:translateX(-50%);
         background-image:var(--bg); background-repeat:no-repeat; background-size:100% auto; }
  body::before { top:calc(var(--s) * -44); height:calc(var(--s) * 590); background-position:top; }
  body::after { bottom:0; height:calc(var(--s) * 185); background-position:bottom; }
  h1 { display:none; }
  #stage { position:relative; height:min(calc(100dvh - var(--s) * 150 - 104px), 175vw); aspect-ratio:9/16; border-radius:14px; overflow:hidden;
           background:#000; box-shadow:0 10px 30px rgba(37,48,107,.35); border:3px solid var(--navy); }
  #cam { position:absolute; object-fit:cover; }
  #cam.mirror { transform:scaleX(-1); }
  #frameImg, #result { position:absolute; inset:0; width:100%; height:100%; }
  #frameImg { pointer-events:none; }
  #result { display:none; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  body { overflow-y:auto; }
  body > *:not(#fx) { position:relative; z-index:1; }
  #stage { margin-top:auto; } #done { margin-bottom:auto; } #live { margin-bottom:auto; }
  #fx { position:fixed; inset:0; width:100%; height:100%; z-index:5 !important; pointer-events:none; }
  body.has-photo #stage { height:min(max(calc(100dvh - var(--s) * 150 - 280px), 30dvh), 110vw); }
  button, .step { font:inherit; font-weight:700; border:0; border-radius:999px; padding:10px 22px;
           background:var(--navy); color:#fff; cursor:pointer; }
  button.sec { background:rgba(255,255,255,.9); color:var(--navy); border:2px solid var(--navy); }
  .steps { display:flex; flex-direction:column; align-items:stretch; width:min(320px,90vw); }
  .step { display:flex; align-items:center; gap:12px; padding:9px 18px 9px 10px; text-align:left;
          text-decoration:none; font-size:.98rem; line-height:1.2; }
  .step .n { flex:none; width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
             background:var(--gold); color:var(--navy); font-size:.9rem; }
  .step.sec .n { background:var(--navy); color:#fff; }
  .step.pts { background:linear-gradient(135deg,#2f7be0,#2457b8); color:#fff; box-shadow:0 0 0 3px var(--gold); }
  .arrow { text-align:center; color:var(--blue); font-size:.9rem; line-height:1; padding:3px 0; }
  #msg { color:var(--navy); font-weight:600; font-size:.82rem; text-align:center; max-width:360px; min-height:1.2em; margin:0; }
  [hidden] { display:none !important; }
</style>

const $ = id => document.getElementById(id);
const cam = $("cam"), frameImg = $("frameImg"), result = $("result"), msg = $("msg");
let stream = null, facing = "user", blob = null;

const frame = new Image(); frame.src = FRAME_SRC; frameImg.src = FRAME_SRC;

/* Caja de la cámara dentro del marco (en %) */
const box = { x:WIN.x-PAD, y:WIN.y-PAD, w:WIN.w+PAD*2, h:WIN.h+PAD*2 };
Object.assign(cam.style, {
  left:(box.x/W*100)+"%", top:(box.y/H*100)+"%",
  width:(box.w/W*100)+"%", height:(box.h/H*100)+"%" });

async function startCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    msg.textContent = "Abre este enlace en Chrome o Safari para usar la cámara.";
    return;
  }
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
  } catch (e) {
    try { stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); }
    catch (e2) {
      msg.textContent = (e2.name === "NotAllowedError" || e.name === "NotAllowedError")
        ? "La cámara está bloqueada. Toca el candado junto al enlace → Permisos → Cámara → Permitir, y vuelve a pulsar «Activar cámara»."
        : "No se pudo abrir la cámara. Cierra otras apps que la usen y pulsa «Activar cámara».";
      return;
    }
  }
  cam.srcObject = stream;
  cam.classList.toggle("mirror", facing === "user");
  $("start").hidden = true; $("shoot").hidden = false; $("flip").hidden = false;
  msg.textContent = "Encuadra tu cara y pulsa «Tomar foto».";
}

function shoot() {
  const vw = cam.videoWidth, vh = cam.videoHeight;
  if (!vw) return;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  // recorte "cover" del vídeo sobre la caja
  const s = Math.max(box.w / vw, box.h / vh);
  const sw = box.w / s, sh = box.h / s;
  const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
  g.save();
  if (facing === "user") { g.translate(W, 0); g.scale(-1, 1); g.drawImage(cam, sx, sy, sw, sh, W - box.x - box.w, box.y, box.w, box.h); }
  else g.drawImage(cam, sx, sy, sw, sh, box.x, box.y, box.w, box.h);
  g.restore();
  g.drawImage(frame, 0, 0, W, H);
  c.toBlob(b => {
    blob = b;
    result.src = URL.createObjectURL(b);
    result.style.display = "block";
    $("live").hidden = true; $("done").hidden = false;
    msg.textContent = "¡Listo! Sigue estos pasos:"; document.body.classList.add("has-photo"); burst(innerWidth/2, innerHeight/2, 120);
    stream.getTracks().forEach(t => t.stop());
  }, "image/jpeg", 0.93);
}

const filename = () => "renata-la-felicidad-incluye.jpg";

function download() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename();
  document.body.appendChild(a); a.click(); a.remove();
  msg.textContent = "¡Foto descargada! Si no la ves, mantén presionada la imagen y elige «Guardar imagen». Después, súbela para ganar tus puntos.";
}

function retry() {
  result.style.display = "none"; document.body.classList.remove("has-photo");
  $("done").hidden = true; $("live").hidden = false;
  startCam();
}

$("start").onclick = startCam;
$("shoot").onclick = shoot;
$("flip").onclick = () => { facing = facing === "user" ? "environment" : "user"; startCam(); };
$("download").onclick = download;
$("retry").onclick = retry;

/* ---------- Papelillos de celebración ---------- */
const fx = $("fx"), fg = fx.getContext("2d");
const COLORS = ["#f2b632","#2f7be0","#ff4d6d","#2ee66b","#3ad7ff","#ff9f1c","#25306b","#c77dff"];
let P = [], dpr = 1, vw = 0, vh = 0;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rnd = (a, b) => a + Math.random() * (b - a);
function sizeFx() {
  dpr = Math.min(devicePixelRatio || 1, 2); vw = innerWidth; vh = innerHeight;
  fx.width = vw * dpr; fx.height = vh * dpr; fg.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function piece(x, y, burst) {
  const a = rnd(0, Math.PI * 2), sp = burst ? rnd(4, 13) : 0;
  return { x, y, w: rnd(6, 11), h: rnd(10, 18), rot: rnd(0, 6.28), vr: rnd(-.15, .15),
    vx: burst ? Math.cos(a) * sp : rnd(-.4, .4), vy: burst ? Math.sin(a) * sp - 4 : rnd(1, 2.6),
    ph: rnd(0, 6.28), tw: rnd(.05, .14), sw: rnd(.3, 1), color: COLORS[(Math.random() * COLORS.length) | 0],
    ribbon: Math.random() < .3, burst, life: 1 };
}
function seed() { P = []; if (reduce) return; for (let i = 0; i < Math.min(70, vw / 6); i++) P.push(piece(rnd(0, vw), rnd(-vh, vh), false)); }
function burst(x, y, n = 40) { if (reduce) return; for (let i = 0; i < n; i++) P.push(piece(x, y, true)); }
function tick() {
  fg.clearRect(0, 0, vw, vh);
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    p.ph += p.tw; p.rot += p.vr;
    if (p.burst) { p.vx *= .97; p.vy = p.vy * .97 + .28; p.life -= .006; }
    else p.vx = Math.sin(p.ph) * p.sw;
    p.x += p.vx; p.y += p.vy;
    if (p.burst ? p.life <= 0 || p.y > vh + 20 : p.y > vh + 20) {
      if (p.burst) { P.splice(i, 1); continue; }
      p.y = -20; p.x = rnd(0, vw);
    }
    fg.save(); fg.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6));
    fg.translate(p.x, p.y); fg.rotate(p.rot); fg.scale(1, Math.cos(p.ph * 1.3));
    fg.fillStyle = p.color;
    if (p.ribbon) { fg.beginPath(); fg.moveTo(-p.w, 0); fg.quadraticCurveTo(0, -p.h * .6, p.w, 0); fg.quadraticCurveTo(0, p.h * .6, -p.w, 0); fg.fill(); }
    else fg.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    fg.restore();
  }
  requestAnimationFrame(tick);
}
addEventListener("resize", sizeFx);
document.addEventListener("pointerdown", e => burst(e.clientX, e.clientY, 36));
sizeFx(); seed(); tick();
</script>
